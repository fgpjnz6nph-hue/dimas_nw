<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certiport Databases – Exam Simulator</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --blue:#2563eb; --blue-soft:#dbeafe; --green:#16a34a; --green-soft:#dcfce7;
  --orange:#f97316; --orange-soft:#ffedd5; --red:#dc2626; --red-soft:#fee2e2;
  --purple:#7c3aed; --purple-soft:#ede9fe; --code:#0f1b3d; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:10px;font-weight:500;transition:.15s}
.btn:hover:not(:disabled){background:#f3f4f6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:#1d4ed8}
.btn.danger{background:#fff;color:var(--red);border-color:#fecaca}
.btn.danger:hover{background:var(--red-soft)}

/* ---------- Layout ---------- */
#app{max-width:1180px;margin:0 auto;padding:28px 24px 70px}
.exam{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start}
.side{padding:18px;position:sticky;top:20px}
.side .back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.side h3{margin:0 0 2px;font-size:17px}
.side p.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:46vh;overflow:auto;padding:2px}
.qb{height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#374151;font-weight:600;font-size:13px;padding:0}
.qb:hover{border-color:#9ca3af}
.qb.answered{background:var(--green);border-color:var(--green);color:#fff}
.qb.flagged{background:var(--orange);border-color:var(--orange);color:#fff}
.qb.cur{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 3px var(--blue-soft)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:14px 0 10px;font-size:12px;color:#4b5563}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;border:1px solid var(--line);background:#fff}
.legend .l-cur{background:var(--blue);border-color:var(--blue)} .legend .l-ans{background:var(--green);border-color:var(--green)} .legend .l-fl{background:var(--orange);border-color:var(--orange)}
.stats{border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:#4b5563;display:grid;gap:2px;margin-bottom:12px}
.stats b{color:var(--ink)}
.side .finish{width:100%}

.main{display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:26px;padding:0 4px;font-size:13px;color:var(--muted)}
.topbar b{display:block;color:var(--ink);font-size:15px;text-align:right}
.topbar .timer{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.topbar .timer.low{color:var(--red)}
.qcard{padding:22px 26px 26px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:#f3f4f6;color:#374151;font-weight:600}
.chip.t{background:var(--blue-soft);border-color:#bfdbfe;color:#1d4ed8}
.chip.k{background:var(--purple-soft);border-color:#ddd6fe;color:var(--purple)}
.flagbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:13px}
.flagbtn.on{background:var(--orange-soft);border-color:#fdba74;color:#c2410c}
.stem{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px;white-space:pre-wrap}
.stem .p{display:block;margin-bottom:6px}
.stem .ins,.stem .uq-note{font-size:13.5px;font-weight:400;color:var(--muted);line-height:1.45}
.stem .uq-stmt{border-left:3px solid var(--blue);padding:2px 0 2px 12px;margin:2px 0 8px}
pre.code{background:var(--code);color:#d6e2ff;border-radius:10px;padding:14px 18px;margin:8px 0 12px;font:500 14.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto}
.qimg{display:block;max-width:100%;margin:6px 0 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
.hint{font-size:13px;color:var(--purple);font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:.12s}
.opt:hover{border-color:#93c5fd;background:#f8fbff}
.opt.sel{border-color:var(--blue);background:#eff6ff;box-shadow:0 0 0 1px var(--blue) inset}
.opt .mk{flex:none;width:18px;height:18px;margin-top:3px;border:2px solid #9ca3af;border-radius:50%;background:#fff;position:relative}
.opt.multi .mk{border-radius:5px}
.opt.sel .mk{border-color:var(--blue);background:var(--blue)}
.opt.sel .mk::after{content:"";position:absolute;inset:3px;background:#fff;border-radius:50%}
.opt.multi.sel .mk::after{border-radius:2px}
.opt .lt{font-weight:700;color:#4b5563;min-width:18px}
.opt .tx{flex:1;white-space:pre-wrap;word-break:break-word}
.opt .tx.mono{font:500 13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
table.yn{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.yn th,table.yn td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left}
table.yn th{background:#f9fafb;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.yn td.c{width:70px;text-align:center}
table.yn tr:last-child td{border-bottom:0}
table.yn input{width:18px;height:18px;accent-color:var(--blue);cursor:pointer}
.rows{display:grid;gap:10px}
.mrow{display:flex;align-items:center;gap:14px;padding:11px 16px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.mrow .nm{font-weight:600;min-width:130px}
select.sel{font:inherit;padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;min-width:150px}
select.sel:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
pre.tpl{background:#f8fafc;border:1px solid var(--line);color:#0f172a;border-radius:10px;padding:14px 18px;font:500 14px/2.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto;margin:0}
pre.tpl select.sel{font:600 13px ui-monospace,Menlo,Consolas,monospace;min-width:120px;padding:3px 6px;border-color:#94a3b8;background:#eef2ff;margin:0 2px}

.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.foot .rem{color:var(--muted);font-size:13.5px}
.credit{position:fixed;right:18px;bottom:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:#374151;display:flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.credit .in{background:#0a66c2;color:#fff;border-radius:3px;font-weight:800;font-size:11px;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center}

/* ---------- Dashboard / results ---------- */
.center{max-width:760px;margin:32px auto}
.hero{padding:34px}
.hero h1{margin:0 0 6px;font-size:28px}
.hero p{color:var(--muted);margin:0 0 22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.form label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.form select,.form input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}
.rules{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:14px;color:#374151;margin-bottom:22px}
.rules li{margin:3px 0}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.score{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin:6px 0 22px}
.ring{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:10px solid var(--green);font-weight:800}
.ring.fail{border-color:var(--red)}
.ring .n{font-size:38px;line-height:1}.ring .o{font-size:12px;color:var(--muted);font-weight:600}
.verdict{font-size:24px;font-weight:800}.verdict.pass{color:var(--green)}.verdict.fail{color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.rv{padding:16px 20px;margin-bottom:12px;border-left:5px solid var(--green)}
.rv.bad{border-left-color:var(--red)} .rv.na{border-left-color:#9ca3af}
.rv .h{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.rv .st{font-weight:600;white-space:pre-wrap;margin-bottom:8px}
.rv .ans{font-size:14px;margin:3px 0;white-space:pre-wrap}
.rv .ans.y{color:#166534}.rv .ans.n{color:#991b1b}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:700}
.tag.ok{background:var(--green-soft);color:#166534}.tag.no{background:var(--red-soft);color:#991b1b}.tag.na{background:#e5e7eb;color:#4b5563}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .box{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%}
.modal h3{margin:0 0 8px}.modal p{margin:0 0 18px;color:#4b5563}
.modal .row{display:flex;gap:10px;justify-content:flex-end}

/* ---------- Touch basics (no visual change on desktop) ---------- */
html{-webkit-text-size-adjust:100%}
button,.opt,.qb{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.navtoggle,.sheetclose,.sheetbg{display:none}

/* ---------- Training mode ---------- */
.startrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn.train{background:var(--green-soft);border-color:#86efac;color:#166534}
.btn.train:hover:not(:disabled){background:#bbf7d0}
.hero p.trnote{margin:12px 0 0;font-size:13px}
.qb.ok{background:var(--green);border-color:var(--green);color:#fff}
.qb.no{background:var(--red);border-color:var(--red);color:#fff}
.legend .l-no{background:var(--red);border-color:var(--red)}
.ring.tr{border-color:var(--blue)}
.opt.locked{cursor:default}
.opt.locked:not(.correct):not(.wrong):hover{border-color:var(--line);background:#fff}
.opt.correct{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 1px var(--green) inset}
.opt.wrong{border-color:var(--red);background:var(--red-soft);box-shadow:0 0 0 1px var(--red) inset}
.opt.correct .mk{border-color:var(--green)}
.opt.sel.correct .mk{border-color:var(--green);background:var(--green)}
.opt.sel.wrong .mk{border-color:var(--red);background:var(--red)}
.opt .vd{margin-left:auto;padding-left:8px;font-weight:800}
.opt.correct .vd,.vd.good{color:#166534}
.opt.wrong .vd{color:#991b1b}
.hintc{color:#991b1b;font-weight:600;font-size:13px}
table.yn tr.ok td{background:var(--green-soft)}
table.yn tr.bad td{background:var(--red-soft)}
.mrow.ok{border-color:#86efac;background:var(--green-soft)}
.mrow.bad{border-color:#fca5a5;background:var(--red-soft)}
select.sel.ok,pre.tpl select.sel.ok{border-color:#16a34a;background:#dcfce7}
select.sel.bad,pre.tpl select.sel.bad{border-color:#dc2626;background:#fee2e2}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid;scroll-margin-bottom:90px}
.fb.ok{background:var(--green-soft);border-color:#86efac;color:#166534}
.fb.bad{background:var(--red-soft);border-color:#fca5a5;color:#991b1b}
.fb>b{font-size:16px}
.fbc{margin-top:6px;color:var(--ink);font-size:14.5px;white-space:pre-wrap;word-break:break-word}

/* ---------- Mobile / tablet (desktop layout is untouched) ---------- */
@media (max-width:860px){
  body{overflow-x:hidden}
  #app{padding:12px 12px 24px}
  .exam{grid-template-columns:1fr;gap:12px}

  /* navigation becomes a bottom sheet */
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .side.open{transform:none}
  .sheetbg{display:block;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheetbg.open{opacity:1;pointer-events:auto}
  .sheetclose{display:block;position:absolute;top:12px;right:12px;padding:4px 11px}
  .grid{grid-template-columns:repeat(7,1fr);max-height:38vh}
  .qb{height:42px;font-size:14px}
  .side .finish{padding:12px}

  /* sticky top bar with the always-visible timer */
  .navtoggle{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:14px;font-weight:600}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);justify-content:space-between;align-items:center;gap:10px;padding:8px 2px calc(8px) 2px;font-size:11px}
  .topbar b{font-size:14px;text-align:left}
  .topbar .timer{font-size:16px}

  /* question */
  .qcard{padding:16px 14px 18px}
  .stem{font-size:17px;overflow-wrap:anywhere}
  .qhead{gap:6px}
  .flagbtn{padding:6px 12px}
  .opt{padding:14px 12px;gap:10px;min-height:52px}
  .opt .tx{font-size:15.5px}
  .opt .tx.mono{font-size:13px}
  pre.code{font-size:13px;padding:12px 14px}
  .qimg{max-width:100%;height:auto}
  table.yn th,table.yn td{padding:10px 8px}
  table.yn td.c{width:52px}
  table.yn input{width:22px;height:22px}
  .mrow{flex-direction:column;align-items:stretch;gap:8px;padding:12px}
  .mrow .nm{min-width:0}
  .mrow>span:nth-child(2){display:none}
  select.sel{width:100%;min-width:0;font-size:16px;padding:10px}
  pre.tpl{font-size:13px;line-height:2.4;padding:12px}
  pre.tpl select.sel{width:auto;min-width:96px;font-size:16px;padding:4px 6px}

  /* previous / next pinned to the bottom */
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
  .foot .btn{flex:0 0 auto;min-width:104px;padding:12px 16px;font-size:15px}
  .foot .rem{flex:1;text-align:center;font-size:12.5px}

  /* dashboard + results */
  .center{margin:8px auto}
  .hero{padding:20px 16px}
  .hero h1{font-size:22px}
  .presets{flex-direction:column}
  .presets .btn{text-align:left;padding:12px 14px}
  .form{grid-template-columns:1fr;gap:12px}
  .form input{font-size:16px}
  .rules{font-size:13.5px;padding:12px 14px 12px 8px}
  .startrow{flex-direction:column;align-items:stretch}
  .startrow .btn{width:100%}
  .score{gap:16px;justify-content:center;text-align:center}
  .ring{width:124px;height:124px;border-width:8px}
  .ring .n{font-size:32px}
  .verdict{font-size:20px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .actions .btn{flex:1 1 auto}
  .rv{padding:14px}
  .rv .st,.rv .ans{overflow-wrap:anywhere}
  .modal{align-items:flex-end;padding:12px}
  .modal .box{padding:20px}
  .modal .row .btn{flex:1;padding:12px}
  .credit{position:static;margin:6px auto 16px;width:max-content}
  .exam-on .credit{margin-bottom:92px}
}
@media (hover:none){
  .opt:not(.sel):not(.correct):not(.wrong):hover{border-color:var(--line);background:#fff}
  .qb:hover{border-color:var(--line)}
}

/* ---------- Login / history / admin ---------- */
.userbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.userbar .who{font-weight:600;font-size:14px;word-break:break-all}
.userbar .sp{flex:1}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.toolbar input,.toolbar select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}
.lgerr{min-height:20px;color:var(--red);font-size:13.5px;font-weight:600;margin:-4px 0 10px}
.admrow{text-align:right;margin-top:26px}
.admlink{background:none;border:0;color:#9ca3af;font-size:10px;opacity:.22;padding:4px 6px;cursor:pointer}
.admlink:hover,.admlink:focus{opacity:.9}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.hist{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.hist th,table.hist td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.hist th{background:#f9fafb;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.hist tr:last-child td{border-bottom:0}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700;display:inline-block}
.badge.ok{background:var(--green-soft);color:#166534}.badge.no{background:var(--red-soft);color:#991b1b}.badge.tr{background:var(--blue-soft);color:#1d4ed8}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.wide{max-width:1000px;margin:20px auto}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.hdr h2{margin:0;font-size:22px}.hdr .sp{flex:1}
.sec{margin:22px 0 10px;font-size:16px;font-weight:700}
.toolbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}
@media (max-width:860px){.wide{margin:8px auto}.hdr .btn{flex:1 1 auto}}
</style>
</head>
<body>
<div id="app"></div>
<div class="credit"><span>Made by Dima</span><span class="in">in</span></div>

<script>

m":"What does this query return?\nSELECT Department, COUNT(*)\nFROM Employees\nGROUP BY Department\nHAVING COUNT(*) > 5;","opts":["Departments with more than 5 employees","All employees in each department","Only departments that have exactly 5 employees","An error, because HAVING can't be used with COUNT()"],"ans":[0]},{"id":69,"type":"single","stem":"Which SQL statement will return the country and number of orders in each country where the number of orders is less than 50?\nOrderID represent an individual order, Country represent the country, and Orders represents the number of orders.","opts":["SELECT COUNT (OrderId), Country\nFROM Orders\nHAVING COUNT(OrderId) < 50;\nGROUP BY Country","SELECT Country, OrderId\nFROM Orders\nGROUP BY Country\nWHERE COUNT(OrderId) < 50;","SELECT COUNT (OrderId), Country\nFROM Orders\nGROUP BY Country\nHAVING COUNT(OrderId) < 50;","SELECT Country, OrderId\nFROM Orders\nWHERE Count(OrderId) < 50;\nGROUP BY Country"],"ans":[2]},{"id":70,"type":"single","stem":"You create the following query to determine whether Sample Movie appears only once in the Movie table.\nSELECT Title\nFROM Movie\nWHERE Title = ‘Sample Movie’\nORDER BY Title\nGROUP BY Title\nHAVING COUNT(*) = 1\nWhen you run this Query, if return a syntax error\nYou need to modify the query to run without error and return accurate result What should you do?","opts":["Remove the group by clause","Change the having clause to having count(title) = 1","Remove the order by clause","Change the having clause to having count(1) = 1"],"ans":[2]},{"id":71,"type":"single","stem":"What would you use to combine columns from two different tables?","opts":["AND","BETWEEN","JOIN","COMBINE"],"ans":[2]},{"id":72,"type":"single","stem":"You’re the database admin for a university that stores student information in a table named student. This table has a foreign key named courseID that links to the primary key in a table named courses. You need to return the student name and course name using both tables where there is a match on courseID. You execute the following query:\nSELECT students.name, courses.name FROM students\nOUTER JOIN courses WHERE student.courseID = courses.courseID\nThe query returns an error.\nHow should you correct the query?","opts":["SELECT students.name, courses.name FROM students\nINNER JOIN courses WHERE students.courseID = courses.courseID","SELECT students.name, courses.name FROM students\nINNER JOIN courses ON students.courseID = courses.coursesID","SELECT students.name,courses.name FROM students\nINNER JOIN ON students.courseID = courses.coursesID","SELECT students.name, courses.name FROM students\nINNER JOIN On courses\nWHERE students.courseID = courses.courseID"],"ans":[1]},{"id":73,"type":"single","stem":"You are working with three tables: Students, Courses, and Enrollments.\nYou need to return the student name, course name, and grade for each enrollment. Which SQL query correctly retrieves this information?","opts":["SELECT s.FirstName, s.LastName, c.CourseName, e.Grade\nFROM Students s\nJOIN Enrollments e ON s.StudentID = e.StudentID\nJOIN Courses c ON e.CourseID = c.CourseID;","SELECT FirstName, LastName, CourseName, Grade\nFROM Students\nJOIN Courses ON Students.StudentID = Courses.CourseID\nJOIN Enrollments ON Students.StudentID = Enrollments.CourseID;","SELECT s.FirstName, s.LastName, c.CourseName, e.Grade\nFROM Students s, Courses c, Enrollments e\nWHERE s.StudentID = e.StudentID AND e.CourseID = c.CourseID;","SELECT s.FirstName, c.CourseName, e.Grade\nFROM Students s\nJOIN Enrollments e ON s.StudentID = c.CourseID\nJOIN Courses c ON e.CourseID = c.CourseID;"],"ans":[0],"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAEoAY0DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1F function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pad=n=>String(n).padStart(2,'0');
function fmt(sec){sec=Math.max(0,sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):pad(m))+':'+pad(s)}

const START=/^(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|GRANT|REVOKE|TRUNCATE|BEGIN|EXEC|DECLARE|USE|BACKUP|RESTORE|WITH|SET)\b/;
const CONT=/^(FROM|WHERE|GROUP BY|ORDER BY|HAVING|JOIN|INNER|LEFT|RIGHT|FULL|ON|AND|OR|VALUES|SET|UNION|AS|INTO|\(|\)|;|BEGIN|END|GO\b)/;
const UQ=/^This question requires that you evaluate the underlined text to determine if it is correct\.\s*([\s\S]*?)\s*\n?Instructions:\s*([\s\S]*)$/;
function renderUnderlined(text){
  const m=text.match(UQ);if(!m||!m[1].trim())return null;
  return '<span class="p uq-note">This question requires that you evaluate the underlined text to determine if it is correct.</span>'
    +'<span class="p uq-stmt">'+esc(m[1].trim())+'</span>'
    +'<span class="p ins">Instructions: '+esc(m[2].trim())+'</span>';
}
function renderStem(text){
  const uq=renderUnderlined(text);if(uq)return uq;
  const lines=text.split('\n');let html='',i=0;
  while(i<lines.length){
    if(START.test(lines[i].trim())){
      let j=i,buf=[lines[i]];j++;
      while(j<lines.length){const t=lines[j].trim();
        if(CONT.test(t)||/[,(]$/.test(lines[j-1].trim())||/^['\[]/.test(t)){buf.push(lines[j]);j++}else break}
      html+='<pre class="code">'+esc(buf.join('\n'))+'</pre>';i=j;
    }else{html+='<span class="p'+(/^Instructions:/i.test(lines[i].trim())?' ins':'')+'">'+esc(lines[i])+'</span>';i++}
  }
  return html;
}
const isCode=t=>/\n/.test(t)||START.test(t.trim());

let S=null, timerId=null;
function isAnswered(q,a){
  if(a===undefined||a===null) return false;
  if(q.type==='single') return a>=0;
  if(q.type==='multi') return a.length>0;
  return Array.isArray(a)&&a.length===(q.ans.length)&&a.every(x=>x!==undefined&&x!==null&&x>=0);
}
function isCorrect(q,a){
  if(!isAnswered(q,a)) return false;
  if(q.type==='single') return a===q.ans[0];
  if(q.type==='multi') return JSON.stringify([...a].sort())===JSON.stringify([...q.ans].sort());
  return a.every((x,i)=>x===q.ans[i]);
}

/* ===================== Training helpers ===================== */
function trainDone(q,a){
  if(a===undefined||a===null) return false;
  if(q.type==='single') return a>=0;
  if(q.type==='multi') return a.length>=q.ans.length;
  return isAnswered(q,a);
}
function answered(q,a){return S&&S.training?trainDone(q,a):isAnswered(q,a)}
function feedback(q,a){
  if(!(S.training&&trainDone(q,a))) return '';

  return `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✓ Correct!':'✗ Incorrect'}</b><div class="fbc"><b>Correct answer:</b>\n${esc(fmtCorrect(q))}</div></div>`;
}

    try{await rpc('admin_delete_student',{p_pass:adminPw(),p_email:email})}catch(e){alert('Could not delete: '+e.message);return}
    store.set('cd_results',getResults().filter(r=>r.email!==email));
    store.set('cd_users',getUsers().filter(u=>u.email!==email));showAdmin();
  });
  bindHist(()=>showStudent(email));
}

/* ===================== Dashboard ===================== */
function showDashboard(){
  clearInterval(timerId);S=null;closeSheet();document.body.classList.remove('exam-on');
  const U=session();if(!U){showLogin();return}if(U.role==='admin'){showAdmin();return}
  const N=BANK.length;
  $('#app').innerHTML=`
  <div class="center"><div class="userbar"><span class="who">👤 ${esc(U.email)}</span><span class="sp"></span><button class="btn sm" id="hist">📋 My history</button><button class="btn sm" id="lo">Log out</button></div><div class="card hero">
    <h1>Certiport Databases – Exam Simulator</h1>
    <p>Each exam draws 40 random questions from a bank of ${N}, in a new random order every time.</p>
    <div class="presets">
      <button class="btn primary" data-n="40" data-m="45">Certiport exam · 40 questions · 45:00</button>
      <button class="btn" data-n="${N}" data-m="45">Practice with all ${N} questions</button>
    </div>
    <div class="form">
      <div><label>Number of questions (max ${N})</label><input id="cfgN" type="number" min="1" max="${N}" value="40"></div>
      <div><label>Time limit (minutes)</label><input id="cfgM" type="number" min="1" max="600" value="45"></div>
    </div>
    <ul class="rules">
      <li>Correct answer = full credit; wrong or unanswered = 0 (no negative marking).</li>
      <li>Score = (correct / total) × 1000. Passing score: <b>700</b>.</li>
      <li>Multi-part questions (Yes/No, matching, drop-downs) count as correct only if every part is right.</li>
      <li>The exam is submitted automatically when the timer reaches 00:00.</li>
    </ul>
    <div class="startrow">
      <button class="btn primary" id="go" style="padding:11px 26px;font-size:16px">Start exam</button>
      <button class="btn train" id="tr" style="padding:11px 26px;font-size:16px">Training mode</button>
    </div>
    <p class="trnote">Training mode: all ${N} questions in random order, no timer – every answer is checked instantly and the correct answer is shown.</p>
  </div></div>`;
  document.querySelectorAll('.presets .btn').forEach(b=>b.onclick=()=>{$('#cfgN').value=b.dataset.n;$('#cfgM').value=b.dataset.m});
  bindUserBar();
  $('#tr').onclick=()=>startExam(BANK.length,0,true);
  $('#go').onclick=()=>{
    const n=Math.min(BANK.length,Math.max(1,parseInt($('#cfgN').value)||40));
    const m=Math.max(1,parseInt($('#cfgM').value)||45);
    startExam(n,m);
  };
}

/* ===================== Exam ===================== */
function startExam(n,minutes,training=false){
  closeSheet();document.body.classList.add('exam-on');
  const order=shuffle(BANK).slice(0,n);
  S={qs:order,idx:0,ans:{},flags:new Set(),training,total:minutes*60,end:training?0:Date.now()+minutes*60000,started:Date.now(),done:false};
  $('#app').innerHTML=`
  <div class="exam">
    <div class="sheetbg" id="sbg"></div>
    <aside class="card side">
      <button class="btn sheetclose" id="sc" aria-label="Close">✕</button>
      <button class="btn back" id="bk">← Dashboard</button>
      <h3>Navigation</h3><p class="sub">${training?'Training mode – answers are checked instantly':'Tap to jump to question'}</p>
      <div class="grid" id="grid"></div>
      ${training?'<div class="legend"><span><i class="l-cur"></i>Current</span><span><i class="l-ans"></i>Correct</span><span><i class="l-no"></i>Wrong</span><span><i class="l-fl"></i>Flagged</span><span><i></i>Unanswered</span></div>':'<div class="legend"><span><i class="l-cur"></i>Current</span><span><i class="l-ans"></i>Answered</span><span><i class="l-fl"></i>Flagged</span><span><i></i>Unanswered</span></div>'}
      <div class="stats" id="stats"></div>
      <button class="btn primary finish" id="fin">${training?'End training':'Finish exam'}</button>
    </aside>
    <section class="main">
      <div class="topbar">
        <button class="btn navtoggle" id="navt">☰ Questions</button>
        <div>Progress<b id="prog"></b></div>
        <div>Flagged<b id="flg"></b></div>
        ${training?'<div>Correct<b id="cor"></b></div>':'<div class="timer" id="tm"><span>⏱</span><span id="tmv"></span></div>'}
      </div>
      <div class="card qcard" id="qc"></div>
      <div class="foot"><button class="btn" id="prev">Previous</button><span class="rem" id="rem"></span><button class="btn primary" id="next">Next</button></div>
    </section>
  </div>`;
  $('#bk').onclick=()=>confirmBox(S.training?'Leave training?':'Leave the exam?','Your progress in this '+(S.training?'session':'attempt')+' will be lost.','Leave',showDashboard);
  $('#fin').onclick=tryFinish;
  $('#navt').onclick=openSheet;$('#sbg').onclick=closeSheet;$('#sc').onclick=closeSheet;
  $('#prev').onclick=()=>go(S.idx-1);
  $('#next').onclick=()=>{S.idx===S.qs.length-1?tryFinish():go(S.idx+1)};
  tick();clearInterval(timerId);timerId=setInterval(tick,500);
  render();
}
function tick(){
  if(!S||S.done||S.training)return;
  const left=Math.ceil((S.end-Date.now())/1000);
  const el=$('#tmv');if(el){el.textContent=fmt(left);$('#tm').classList.toggle('low',left<=300)}
  if(left<=0)finish(true);
}
function go(i){if(i<0||i>=S.qs.length)return;closeSheet();S.idx=i;render();window.scrollTo({top:0,behavior:'smooth'})}
function stats(){
  const n=S.qs.length;let a=0,c=0;S.qs.forEach(q=>{const x=S.ans[q.id];if(answered(q,x)){a++;if(isCorrect(q,x))c++}});
  return {n,a,r:n-a,f:S.flags.size,c,w:a-c};
}
function render(){
  const q=S.qs[S.idx],st=stats();
  // nav
  $('#grid').innerHTML=S.qs.map((x,i)=>{
    const ax=S.ans[x.id];
    const cls=S.training?(i===S.idx?'cur':answered(x,ax)?(isCorrect(x,ax)?'ok':'no'):S.flags.has(x.id)?'flagged':''):(i===S.idx?'cur':S.flags.has(x.id)?'flagged':isAnswered(x,ax)?'answered':'');
    return `<button class="qb ${cls}" data-i="${i}">${i+1}</button>`}).join('');
  document.querySelectorAll('.qb').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const cur=document.querySelector('.qb.cur');if(cur&&(window.innerWidth>860||document.querySelector('.side.open')))cur.scrollIntoView({block:'nearest'});
  $('#stats').innerHTML=S.training
    ?`<div>Answered: <b>${st.a}/${st.n}</b></div><div>Remaining: <b>${st.r}</b></div><div>Correct: <b>${st.c}</b> · Wrong: <b>${st.w}</b></div><div>Accuracy: <b>${st.a?Math.round(st.c/st.a*100)+'%':'–'}</b></div><div>Flagged: <b>${st.f}</b></div>`
    :`<div>Answered: <b>${st.a}/${st.n}</b></div><div>Remaining: <b>${st.r}</b></div><div>Flagged: <b>${st.f}</b></div>`;
  $('#prog').textContent=`${st.a}/${st.n}`;$('#flg').textContent=st.f;
  if(S.training)$('#cor').textContent=`${st.c} ✓ · ${st.w} ✗`;
  $('#rem').textContent=`${st.r} remaining`;
  $('#prev').disabled=S.idx===0;
  $('#next').textContent=S.idx===S.qs.length-1?'Finish':'Next';
  // question
  const fl=S.flags.has(q.id);
  let html=`<div class="qhead"><span class="chip">${pad(S.idx+1)}/${pad(st.n)}</span><span class="chip t">${esc(topicOf(q.id))}</span><span class="chip k">${KIND[q.type]}</span>
    <button class="btn flagbtn ${fl?'on':''}" id="flag">⚑ ${fl?'Flagged':'Flag'}</button></div>`;
  html+=`<div class="stem">${renderStem(q.stem)}</div>`;
  (q.imgs||[]).forEach(src=>html+=`<img class="qimg" src="${src}" alt="">`);
  html+=body(q,S.ans[q.id])+feedback(q,S.ans[q.id]);
  $('#qc').innerHTML=html;
  $('#flag').onclick=()=>{S.flags.has(q.id)?S.flags.delete(q.id):S.flags.add(q.id);render()};
  bind(q);
}
function body(q,a){
  const lk=!!(S&&S.training&&trainDone(q,a)),dis=lk?' disabled':'';
  if(q.type==='single'||q.type==='multi'){
    const multi=q.type==='multi';
    let h=multi&&!/choose\s+(two|three|four|\d)/i.test(q.stem)?`<p class="hint">Choose ${q.ans.length}</p>`:'';
    h+='<div class="opts">'+q.opts.map((t,i)=>{
      const sel=multi?(a||[]).includes(i):a===i;
      let cls='',vd='';
      if(lk){const isC=q.ans.includes(i);cls=' locked'+(isC?' correct':(sel?' wrong':''));vd=isC?'<span class="vd">✓</span>':(sel?'<span class="vd">✗</span>':'')}
      return `<div class="opt ${multi?'multi':''} ${sel?'sel':''}${cls}" data-i="${i}"><span class="mk"></span><span class="lt">${L(i)}.</span><span class="tx ${isCode(t)?'mono':''}">${esc(t)}</span>${vd}</div>`}).join('')+'</div>';
    return h;
  }
  if(q.type==='yn'){
    return `<table class="yn"><thead><tr><th>Statement</th><th style="text-align:center">Yes</th><th style="text-align:center">No</th></tr></thead><tbody>`+
      q.rows.map((r,i)=>{
        let rc='',note='';
        if(lk){const ok=a[i]===q.ans[i];rc=ok?' class="ok"':' class="bad"';note=ok?' <span class="vd good">✓</span>':` <span class="hintc">✗ correct: ${q.ans[i]?'Yes':'No'}</span>`}
        return `<tr${rc}><td><b>${L(i)}.</b> ${esc(r)}${note}</td><td class="c"><input type="radio" name="r${i}" data-r="${i}" data-v="1" ${a&&a[i]===1?'checked':''}${dis}></td><td class="c"><input type="radio" name="r${i}" data-r="${i}" data-v="0" ${a&&a[i]===0?'checked':''}${dis}></td></tr>`}).join('')+`</tbody></table>`;
  }
  if(q.type==='match'){
    return '<div class="rows">'+q.rows.map((r,i)=>{
      let rc='',note='';
      if(lk){const ok=a[i]===q.ans[i];rc=ok?' ok':' bad';note=ok?'<span class="vd good">✓</span>':`<span class="hintc">✗ correct: ${esc(q.choices[q.ans[i]])}</span>`}
      return `<div class="mrow${rc}"><span class="nm">${esc(r)}</span><span>→</span><select class="sel" data-s="${i}"${dis}><option value="-1">Select…</option>${q.choices.map((c,j)=>`<option value="${j}" ${a&&a[i]===j?'selected':''}>${esc(c)}</option>`).join('')}</select>${note}</div>`}).join('')+'</div>';
  }
  if(q.type==='blanks'){
    const parts=esc(q.tpl).replace(/\{(\d+)\}/g,(m,n)=>{n=+n;const sc=lk?(a[n]===q.ans[n]?' ok':' bad'):'';return `<select class="sel${sc}" data-s="${n}"${dis}><option value="-1">Select…</option>${q.pools[n].map((c,j)=>`<option value="${j}" ${a&&a[n]===j?'selected':''}>${esc(c)}</option>`).join('')}</select>`});
    return `<pre class="tpl">${parts}</pre>`;
  }
  return '';
}
function bind(q){
  if(S.training&&trainDone(q,S.ans[q.id]))return;
  const set=v=>{S.ans[q.id]=v;render();if(S.training&&trainDone(q,v)){const f=document.querySelector('.fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'})}};
  if(q.type==='single')document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>set(+o.dataset.i));
  if(q.type==='multi')document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    const i=+o.dataset.i,cur=new Set(S.ans[q.id]||[]);cur.has(i)?cur.delete(i):cur.add(i);set([...cur].sort())});
  if(q.type==='yn')document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{
    const arr=(S.ans[q.id]||new Array(q.ans.length).fill(-1)).slice();arr[+r.dataset.r]=+r.dataset.v;set(arr)});
  if(q.type==='match'||q.type==='blanks')document.querySelectorAll('select.sel').forEach(s=>s.onchange=()=>{
    const arr=(S.ans[q.id]||new Array(q.ans.length).fill(-1)).slice();arr[+s.dataset.s]=+s.value;set(arr)});
}

/* ===================== Finish / results ===================== */
function confirmBox(title,msg,okText,fn){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="row"><button class="btn" id="c1">Cancel</button><button class="btn primary" id="c2">${esc(okText)}</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#c1').onclick=()=>m.remove();
  m.querySelector('#c2').onclick=()=>{m.remove();fn()};
}
function tryFinish(){
  const st=stats(),tr=S.training;
  confirmBox(tr?'End training?':'Finish exam?',
    st.r?(tr?`You still have ${st.r} unanswered question${st.r>1?'s':''}. The summary will cover the ${st.a} you answered.`:`You still have ${st.r} unanswered question${st.r>1?'s':''}. Unanswered questions score 0.`):(tr?'See your training summary?':'Submit your answers and see the result?'),
    tr?'End':'Finish',()=>finish(false));
}
function finish(auto){
  if(!S||S.done)return;S.done=true;clearInterval(timerId);
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  const n=S.qs.length;let c=0,u=0;
  S.qs.forEach(q=>{const a=S.ans[q.id];if(!answered(q,a))u++;else if(isCorrect(q,a))c++});
  const score=Math.round(c/n*1000),pass=score>=700;
  const used=S.training?Math.round((Date.now()-S.started)/1000):Math.min(S.total,Math.round((Date.now()-S.started)/1000));
  S.result={c,u,w:n-c-u,score,pass,used,acc:(n-u)?Math.round(c/(n-u)*100):0};
  saveResult();
  showResults(auto);
}
function fmtAns(q,a){
  if(!isAnswered(q,a)) return '— no answer —';
  if(q.type==='single') return `${L(a)}. ${q.opts[a]}`;
  if(q.type==='multi') return a.map(i=>`${L(i)}. ${q.opts[i]}`).join('\n');
  if(q.type==='yn') return q.rows.map((r,i)=>`${L(i)}. ${a[i]?'Yes':'No'}`).join('   ');
  if(q.type==='match') return q.rows.map((r,i)=>`${r} → ${q.choices[a[i]]}`).join('\n');
  if(q.type==='blanks') return a.map((v,i)=>`[${i+1}] ${q.pools[i][v]}`).join('\n');
}
function fmtCorrect(q){
  if(q.type==='single'||q.type==='multi') return q.ans.map(i=>`${L(i)}. ${q.opts[i]}`).join('\n');
  if(q.type==='yn') return q.rows.map((r,i)=>`${L(i)}. ${q.ans[i]?'Yes':'No'}`).join('   ');
  if(q.type==='match') return q.rows.map((r,i)=>`${r} → ${q.choices[q.ans[i]]}`).join('\n');
  if(q.type==='blanks') return q.ans.map((v,i)=>`[${i+1}] ${q.pools[i][v]}`).join('\n');
}
function showResults(auto){
  const R=S.result,n=S.qs.length;
  document.body.classList.remove('exam-on');closeSheet();
  $('#app').innerHTML=`<div class="center">
    <div class="card hero">
      ${auto?'<p style="color:#c2410c;font-weight:600;margin:0 0 10px">⏱ Time is up – exam submitted automatically.</p>':''}
      ${S.training
        ?`<div class="score"><div class="ring tr"><span class="n">${R.acc}%</span><span class="o">accuracy</span></div>
        <div><div class="verdict" style="color:var(--ink)">Training session finished</div><div style="color:var(--muted)">Answered ${n-R.u} of ${n} · Time spent: ${fmt(R.used)}</div></div></div>`
        :`<div class="score"><div class="ring ${R.pass?'':'fail'}"><span class="n">${R.score}</span><span class="o">/ 1000</span></div>
        <div><div class="verdict ${R.pass?'pass':'fail'}">${R.pass?'PASSED':'NOT PASSED'}</div><div style="color:var(--muted)">Passing score: 700 · Time used: ${fmt(R.used)}</div></div></div>`}
      <div class="kpis"><div class="kpi"><b>${R.c}</b><span>Correct</span></div><div class="kpi"><b>${R.w}</b><span>Incorrect</span></div><div class="kpi"><b>${R.u}</b><span>Unanswered</span></div><div class="kpi"><b>${n}</b><span>Total</span></div></div>
      <div class="actions"><button class="btn primary" id="again">${S.training?'New training session':'Retake (reshuffle)'}</button><button class="btn" id="dash">Dashboard</button><button class="btn" id="hs">My history</button></div>
      <div class="actions"><span style="align-self:center;font-weight:600">Review:</span>
        <button class="btn f" data-f="all">All</button><button class="btn f" data-f="bad">${S.training?'Incorrect':'Incorrect / unanswered'}</button><button class="btn f" data-f="flag">Flagged</button></div>
    </div>
    <div id="rv" style="margin-top:16px"></div></div>`;
  $('#again').onclick=()=>S.training?startExam(BANK.length,0,true):startExam(n,S.total/60);
  $('#dash').onclick=showDashboard;$('#hs').onclick=showHistory;
  const draw=f=>{
    const items=S.qs.map((q,i)=>({q,i,a:S.ans[q.id]})).filter(x=>f==='all'||(f==='bad'&&!isCorrect(x.q,x.a)&&(!S.training||answered(x.q,x.a)))||(f==='flag'&&S.flags.has(x.q.id)));
    $('#rv').innerHTML=items.length?items.map(({q,i,a})=>{
      const ok=isCorrect(q,a),na=!answered(q,a);
      return `<div class="card rv ${ok?'':na?'na':'bad'}"><div class="h"><span class="chip">#${i+1}</span><span class="chip t">${esc(topicOf(q.id))}</span><span class="chip">PDF Q${q.id}</span><span class="tag ${ok?'ok':na?'na':'no'}">${ok?'Correct':na?'Unanswered':'Incorrect'}</span>${S.flags.has(q.id)?'<span class="chip" style="background:var(--orange-soft);color:#c2410c">⚑ Flagged</span>':''}</div>
        <div class="stem" style="font-size:16px">${renderStem(q.stem)}</div>${(q.imgs||[]).map(s=>`<img class="qimg" src="${s}" alt="">`).join('')}
        ${ok?'':`<div class="ans n"><b>Your answer:</b>\n${esc(fmtAns(q,a))}</div>`}<div class="ans y"><b>Correct answer:</b>\n${esc(fmtCorrect(q))}</div></div>`}).join(''):'<div class="card rv"><b>Nothing to show here.</b></div>';
  };
  document.querySelectorAll('.btn.f').forEach(b=>b.onclick=()=>draw(b.dataset.f));
  draw('bad');
}

document.addEventListener('keydown',e=>{
  if(!S||S.done||e.target.tagName==='SELECT'||document.querySelector('.modal'))return;
  if(e.key==='ArrowRight')go(S.idx+1);if(e.key==='ArrowLeft')go(S.idx-1);
});
window.addEventListener('beforeunload',e=>{if(S&&!S.done){e.preventDefault();e.returnValue=''}});
window.addEventListener('resize',()=>{if(window.innerWidth>860)closeSheet()});
showDashboard();
</script>
</body>
</html>
